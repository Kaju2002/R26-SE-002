name: Fake job detection CI

on:
  pull_request:
    branches: [main, master]
    paths:
      - services/fake-job-detection/**
      - tests/fake_job_detection/**
      - pytest.ini
      - tests/requirements.txt
      - tests/service_imports.py
      - tests/__init__.py
      - .github/workflows/fake-job-detection.yml
  push:
    branches: [main, master]
    paths:
      - services/fake-job-detection/**
      - tests/fake_job_detection/**
      - pytest.ini
      - tests/requirements.txt
      - tests/service_imports.py
      - tests/__init__.py
      - .github/workflows/fake-job-detection.yml

concurrency:
  group: fake-job-detection-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tests/requirements.txt
            services/fake-job-detection/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt
          pip install -r services/fake-job-detection/requirements.txt

      - name: Run pytest
        run: python -m pytest tests/fake_job_detection -v
