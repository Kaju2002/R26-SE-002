name: Job recommendation CI

on:
  pull_request:
    branches: [main, master]
    paths:
      - services/job-recommendation/**
      - tests/job_recommendation/**
      - pytest.ini
      - tests/requirements.txt
      - tests/service_imports.py
      - tests/__init__.py
      - .github/workflows/job-recommendation.yml
  push:
    branches: [main, master]
    paths:
      - services/job-recommendation/**
      - tests/job_recommendation/**
      - pytest.ini
      - tests/requirements.txt
      - tests/service_imports.py
      - tests/__init__.py
      - .github/workflows/job-recommendation.yml

concurrency:
  group: job-recommendation-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tests/requirements.txt
            services/job-recommendation/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt
          pip install -r services/job-recommendation/requirements.txt

      - name: Run pytest
        run: python -m pytest tests/job_recommendation -v
