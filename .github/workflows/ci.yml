name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ml-tests:
    name: ML tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tests/requirements.txt
            services/scam-detection/requirements.txt
            services/fake-job-detection/requirements.txt
            services/employer-verification/requirements.txt
            services/job-recommendation/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt
          pip install -r services/scam-detection/requirements.txt
          pip install -r services/fake-job-detection/requirements.txt
          pip install -r services/employer-verification/requirements.txt
          pip install -r services/job-recommendation/requirements.txt
          pip install "scikit-learn>=1.9"

      - name: Run pytest
        run: python -m pytest tests/ -v

  user-management-tests:
    name: user-management (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: services/user-management

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/user-management/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  chat-management-tests:
    name: chat-management (node:test)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: services/chat-management

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/chat-management/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  job-management-tests:
    name: job-management (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: services/job-management

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/job-management/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
