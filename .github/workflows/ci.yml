name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      workflow: ${{ steps.filter.outputs.workflow }}
      python_shared: ${{ steps.filter.outputs.python_shared }}
      scam_detection: ${{ steps.filter.outputs.scam_detection }}
      fake_job_detection: ${{ steps.filter.outputs.fake_job_detection }}
      employer_verification: ${{ steps.filter.outputs.employer_verification }}
      job_recommendation: ${{ steps.filter.outputs.job_recommendation }}
      assistant: ${{ steps.filter.outputs.assistant }}
      user_management: ${{ steps.filter.outputs.user_management }}
      chat_management: ${{ steps.filter.outputs.chat_management }}
      job_management: ${{ steps.filter.outputs.job_management }}
      notification_management: ${{ steps.filter.outputs.notification_management }}
      email_management: ${{ steps.filter.outputs.email_management }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workflow:
              - '.github/workflows/**'
            python_shared:
              - 'pytest.ini'
              - 'tests/requirements.txt'
              - 'tests/service_imports.py'
              - 'tests/__init__.py'
            scam_detection:
              - 'services/scam-detection/**'
              - 'tests/scam_detection/**'
            fake_job_detection:
              - 'services/fake-job-detection/**'
              - 'tests/fake_job_detection/**'
            employer_verification:
              - 'services/employer-verification/**'
              - 'tests/employer_verification/**'
            job_recommendation:
              - 'services/job-recommendation/**'
              - 'tests/job_recommendation/**'
            assistant:
              - 'services/assistant/**'
              - 'tests/assistant/**'
            user_management:
              - 'services/user-management/**'
            chat_management:
              - 'services/chat-management/**'
            job_management:
              - 'services/job-management/**'
            notification_management:
              - 'services/notification-management/**'
            email_management:
              - 'services/email-management/**'

  python-tests:
    name: ${{ matrix.name }} (pytest)
    needs: changes
    if: >-
      needs.changes.outputs.workflow == 'true' ||
      needs.changes.outputs.python_shared == 'true' ||
      (matrix.key == 'scam_detection' && needs.changes.outputs.scam_detection == 'true') ||
      (matrix.key == 'fake_job_detection' && needs.changes.outputs.fake_job_detection == 'true') ||
      (matrix.key == 'employer_verification' && needs.changes.outputs.employer_verification == 'true') ||
      (matrix.key == 'job_recommendation' && needs.changes.outputs.job_recommendation == 'true') ||
      (matrix.key == 'assistant' && needs.changes.outputs.assistant == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: scam_detection
            name: scam-detection
            requirements: services/scam-detection/requirements.txt
            tests: tests/scam_detection
          - key: fake_job_detection
            name: fake-job-detection
            requirements: services/fake-job-detection/requirements.txt
            tests: tests/fake_job_detection
          - key: employer_verification
            name: employer-verification
            requirements: services/employer-verification/requirements.txt
            tests: tests/employer_verification
          - key: job_recommendation
            name: job-recommendation
            requirements: services/job-recommendation/requirements.txt
            tests: tests/job_recommendation
          - key: assistant
            name: assistant
            requirements: services/assistant/requirements.txt
            tests: tests/assistant

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tests/requirements.txt
            ${{ matrix.requirements }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt
          pip install -r ${{ matrix.requirements }}

      - name: Align employer scikit-learn
        if: matrix.key == 'employer_verification'
        run: pip install "scikit-learn>=1.9,<1.10"

      - name: Run pytest
        run: python -m pytest ${{ matrix.tests }} -v

  user-management-tests:
    name: user-management (Vitest)
    needs: changes
    if: needs.changes.outputs.user_management == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: services/user-management

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/user-management/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  chat-management-tests:
    name: chat-management (Vitest)
    needs: changes
    if: needs.changes.outputs.chat_management == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: services/chat-management

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/chat-management/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  job-management-tests:
    name: job-management (Vitest)
    needs: changes
    if: needs.changes.outputs.job_management == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: services/job-management

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/job-management/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  notification-management-tests:
    name: notification-management (Vitest)
    needs: changes
    if: needs.changes.outputs.notification_management == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: services/notification-management

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/notification-management/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  email-management-tests:
    name: email-management (Vitest)
    needs: changes
    if: needs.changes.outputs.email_management == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: services/email-management

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/email-management/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
