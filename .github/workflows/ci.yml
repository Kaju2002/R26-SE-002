name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      workflow: ${{ steps.filter.outputs.workflow }}
      ml: ${{ steps.filter.outputs.ml }}
      user_management: ${{ steps.filter.outputs.user_management }}
      chat_management: ${{ steps.filter.outputs.chat_management }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workflow:
              - '.github/workflows/**'
            ml:
              - 'tests/**'
              - 'services/scam-detection/**'
              - 'services/fake-job-detection/**'
              - 'services/employer-verification/**'
              - 'services/job-recommendation/**'
            user_management:
              - 'services/user-management/**'
            chat_management:
              - 'services/chat-management/**'

  ml-tests:
    name: ML tests (pytest)
    needs: changes
    if: needs.changes.outputs.ml == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tests/requirements.txt
            services/scam-detection/requirements.txt
            services/fake-job-detection/requirements.txt
            services/employer-verification/requirements.txt
            services/job-recommendation/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt
          pip install -r services/scam-detection/requirements.txt
          pip install -r services/fake-job-detection/requirements.txt
          pip install -r services/employer-verification/requirements.txt
          pip install -r services/job-recommendation/requirements.txt
          pip install "scikit-learn>=1.9"

      - name: Run pytest
        run: python -m pytest tests/ -v

  user-management-tests:
    name: user-management (Vitest)
    needs: changes
    if: needs.changes.outputs.user_management == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: services/user-management

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/user-management/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  chat-management-tests:
    name: chat-management (node:test)
    needs: changes
    if: needs.changes.outputs.chat_management == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: services/chat-management

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/chat-management/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
